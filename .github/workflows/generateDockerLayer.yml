name: Generate Docker Layer

on:
  push:
    branches:
      - master
    tags:
      - "v*.*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Generate Docker image metadata
      id: metadata
      run: |
        if [[ ${GITHUB_REF_TYPE} == tag ]]; then
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
        else
          echo "tag=latest" >> $GITHUB_OUTPUT
        fi

    - name: Login to GitHub registry
      uses: docker/login-action@v3
      with:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        registry: ghcr.io

    # --- fix repositories that have upper-case letters ---
    - name: Set lower-case repository name
      id: repo_lc
      run: |
        # Lowercase github.repository (owner/repo). Use tr for portability.
        echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: ghcr.io/${{ env.REPO_LC }}:${{ steps.metadata.outputs.tag }}
